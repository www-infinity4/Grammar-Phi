name: Source Routing Verification
on:
  push:
    paths:
      - '.github/workflows/source-routing.yml'
      - 'test/**'
      - 'routing.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Run tests
        run: node --test ./test/**/*.test.js
